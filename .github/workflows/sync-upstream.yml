name: Sync upstream

# Keep this workflow on the default branch. It merges upstream changes,
# preserves fork-only commits, and fails instead of overwriting conflicts.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == '666Abner666/rea' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify upstream and synchronize main
        shell: bash
        run: |
          set -euo pipefail
          parent="$(gh api "repos/${GH_REPO}" --jq '.parent.full_name')"
          if [[ "$parent" != "morluto/rea" ]]; then
            echo "::error::Unexpected upstream repository; refusing to synchronize."
            exit 1
          fi
          # GitHub performs a normal merge, never a reset or force-push.
          # Merge conflicts and permission errors fail the run for review.
          if gh api --method POST "repos/${GH_REPO}/merge-upstream" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f branch=main --jq '.message' > sync-result.txt; then
            cat sync-result.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Upstream sync failed. Resolve any conflict or permission issue before retrying; no force-push was attempted."
            echo "Sync failed. Review the error above; no force-push was attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
